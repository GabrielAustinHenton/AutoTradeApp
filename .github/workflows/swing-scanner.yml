name: Swing Scanner

on:
  # Morning scan: weekdays at 13:35 UTC = 9:35 AM EDT / 8:35 AM EST
  # EOD scan:     weekdays at 19:45 UTC = 3:45 PM EDT / 2:45 PM EST
  schedule:
    - cron: '35 13 * * 1-5'
    - cron: '45 19 * * 1-5'
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  scan:
    name: Run Swing Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Quick scan — no long-running loop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run swing scanner
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          SWING_CAPITAL_PER_TRADE: '100'
          SWING_MAX_POSITIONS: '5'
        run: npx tsx scripts/swing-cron.ts
